# Public-tree gate (tools/check_public_tree.py): this repository's additions to the built-in rules. Lists only grow here.
# Exceptions go in .public-tree-allow, each with a reason. See the header of the script for the directives.

# What this tool writes: glTF exports and decoded textures are extracted game data.
private_ext .glb
private_ext .png
# The game's bundles have no extension, so only the size limit stopped one, and a bundle under the
# limit passed. A UnityFS bundle starts with the text UnityFS and a zero byte; this matches a file
# that starts that way, whatever its name (a text that only mentions the word does not match).
marker \AUnityFS(?=\x00)

[package]
name = "nocturne-unpack"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Reader for the Unity asset bundles of Shin Megami Tensei III Nocturne HD Remaster"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/patodois/nocturne-unpack"
keywords = ["unity", "assetbundle", "smt3", "nocturne", "gltf"]
categories = ["game-development", "parser-implementations", "command-line-utilities"]
exclude = ["/.github", "/packaging", "/NOTES-upstream.md", "/target", "/dist"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
memmap2 = "0.9"
# Reads UnityFS bundles and deserializes objects through their type trees (Unity 2018.4 and 2019.4)
unity-bundle = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Block-compression texture decoder (BC1 to BC7), written from the public specifications
bcn-decode = "0.1.0"
png = "0.18.1"
# Shared model types for crossovers with other game rewrites
rewrite-bridge = { version = "0.2.1", optional = true }

# The peak memory report of check
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
bridge = ["dep:rewrite-bridge"]

# Decoding is slow without optimisations; keep our own code debuggable
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.nocturne-unpack]
opt-level = 3

[package]
name = "nocturne-unpack"
version = "0.1.0"
edition = "2021"
description = "Reader for the Unity asset bundles of Shin Megami Tensei III Nocturne HD Remaster"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
memmap2 = "0.9"
# Reads UnityFS bundles and deserializes objects through their type trees. rabex 0.2.1 plus three small
# fixes (Unity 2019.4 headers, ranged reads, a bounded read buffer) that are not in a release yet: our fork's
# branch `nocturne` merges them (see NOTES-upstream.md). A git dependency, so it also works for crates that
# depend on this one, which a [patch] section would not.
rabex = { git = "https://github.com/patodois/RustyAssetBundleEXtractor", branch = "nocturne", default-features = false, features = ["compression-lz4", "compression-lzma"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
texture2ddecoder = "0.1.2"
png = "0.18.1"
# Shared model types for crossovers with other game rewrites
rewrite-bridge = { git = "https://github.com/patodois/rewrite-bridge", tag = "v0.1.0", optional = true }

# The peak memory report of check
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
bridge = ["dep:rewrite-bridge"]

# Decoding is slow without optimisations; keep our own code debuggable
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.nocturne-unpack]
opt-level = 3
